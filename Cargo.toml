[package]
name = "cash-gb"
authors = ["Cash <master_Cash@live.com>"]
version = "0.1.0"
edition = "2024"

[dependencies]
console = "0.16.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }
eframe = { version = "0.36.1", features = ["persistence"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
serde = { version = "1.0.229", features = ["derive"] }
